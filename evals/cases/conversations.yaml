# Conversations (CU-02, CU-04, CU-05, CU-06): code checks + the judge's rubric.
# perfil: profile fields; hoy: meals logged before the turn (food_id: grams); turnos: user messages.
# usuario_simulado: the answer the simulated user gives if the agent asks a question.
# esperado.herramientas: tools that must be called (any order); sin_herramientas: tools that must not.
- id: conv-01
  origen: [CU-04, CU-05]
  validado: true
  perfil: {sex: male, age: 34, weight_kg: 70, height_cm: 175, activity_level: light, goal: maintain}
  hoy: {pan_tostado_casero: 60, aceite_oliva: 10, cafe_con_leche: 200, arroz_blanco_cocido: 200, pechuga_pollo_plancha: 150, tomate: 150}
  turnos: ["Esta tarde corro 10 km. Regístralo y propónme merienda y cena."]
  esperado: {herramientas: [log_activity, plan_rest_of_day], guardian: ok}
