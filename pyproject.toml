[project]
name = "mojo-picon"
version = "0.0.1"
description = "Agentic nutrition assistant: logs meals, plans the rest of the day with code-verified numbers and refers risky cases to a professional."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "fastmcp>=4.1.0",
    "firebase-admin>=7.7.0",
    "google-cloud-firestore>=2.34.1",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.1",
    "langchain-litellm>=0.11.1",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "litellm>=1.106.0",
    "pillow>=12.3.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
data = [
    "pypdf>=6.20.1",
    "xlrd>=2.0.2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "pytest-asyncio>=1.4.0",
]
eval = [
    "deepeval>=4.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mojo_picon"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# User-facing Spanish text uses typographic dashes and minus signs on purpose ("1,2–2 g/kg", "−18 %").
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:deepeval"  # DeepEval (eval group) registers a pytest plugin; evals run as scripts
asyncio_mode = "auto"
markers = ["integration: needs the Firestore emulator (FIRESTORE_EMULATOR_HOST)"]
# LangGraph serialises the runtime context (AgentContext) for tracing; harmless.
filterwarnings = ["ignore:Pydantic serializer warnings:UserWarning"]
