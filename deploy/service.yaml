# Cloud Run service, versioned (Infraestructura y CI-CD). Applied by CI with
# `gcloud run services replace`; ${IMAGE} is filled in by the deploy job.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mojo-picon
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0" # set to 1 during the demo to avoid cold starts
        autoscaling.knative.dev/maxScale: "2" # cost limit; the rate limit is per instance (milestone 1)
        run.googleapis.com/cpu-throttling: "false" # SSE streams keep working while the turn runs
    spec:
      serviceAccountName: mojo-run@mojo-picon.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: ENVIRONMENT
              value: production
            - name: GCP_PROJECT_ID
              value: mojo-picon
            - name: FIRESTORE_DATABASE
              value: mojopicon
            # Plan B if the EU endpoint is slow (EU residency kept; ADR-04; retires 2026-10-20): VERTEX_LOCATION=europe-west1,
            # VERTEX_ENDPOINT=https://europe-west1-aiplatform.googleapis.com, GEMINI_MODEL=gemini-2.5-flash
            - name: GEMINI_MODEL
              value: gemini-3.8-flash
            - name: LANGFUSE_HOST
              value: https://cloud.langfuse.com # EU region
            - name: QDRANT_URL # guideline index (RAG); not secret
              value: https://84d5ceea-c6e9-48b7-a73c-c5a8e9379ac8.europe-west3-0.gcp.cloud.qdrant.io
            # Secrets from Secret Manager (values added by the owner; Cloud Run reads only these)
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-public-key
                  key: latest
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret-key
                  key: latest
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-api-key
                  key: latest
