# Recetas: platos españoles sencillos y altos en proteína, para ganar músculo (Mis recetas).
# ingredientes: food_id de data/foods.csv -> gramos de la receta entera, con el peso del alimento tal como
#   está en la tabla (cocido cuando la tabla lo tiene cocido). Los nutrientes y los alérgenos los calcula
#   el código (tools/recipes.py); nada se escribe a mano.
# raciones: en cuántas raciones se reparte; una ración = gramos totales / raciones.
# pasos: redactados para Mojo Picón, breves y sin copiar ninguna fuente.
# validado: false hasta que el autor (o un dietista-nutricionista) las revise.
- id: receta_lentejas_estofadas
  nombre: Lentejas estofadas con chorizo
  raciones: 4
  etiquetas: [comida, legumbres, alto_en_proteina]
  ingredientes: {lentejas_cocidas: 1000, chorizo: 80, patata_cocida: 300, zanahoria: 120, cebolla: 100, pimiento_rojo: 80, ajo: 10, aceite_oliva: 30}
  pasos:
    - Sofríe la cebolla, el pimiento, el ajo y la zanahoria picados en el aceite.
    - Añade el chorizo en rodajas y la patata en trozos, y cubre con agua.
    - Incorpora las lentejas cocidas y deja hervir a fuego suave 15 minutos.
  validado: false
- id: receta_garbanzos_espinacas
  nombre: Garbanzos con espinacas y huevo
  raciones: 4
  etiquetas: [comida, legumbres, alto_en_proteina]
  ingredientes: {garbanzos_cocidos: 800, espinacas_cocidas: 400, huevo_cocido: 200, tomate: 100, pan_blanco: 40, ajo: 10, aceite_oliva: 30}
  pasos:
    - Fríe el pan y el ajo en el aceite y májalos con un poco de agua.
    - Rehoga el tomate, añade las espinacas y los garbanzos con su caldo y el majado.
    - Sirve con el huevo cocido en cuartos.
  validado: false
- id: receta_pollo_ajillo_arroz
  nombre: Pollo al ajillo con arroz
  raciones: 2
  etiquetas: [comida, cena, alto_en_proteina]
  ingredientes: {pechuga_pollo_plancha: 400, arroz_blanco_cocido: 400, ajo: 20, aceite_oliva: 20, limon: 20}
  pasos:
    - Dora el pollo en dados con el aceite y los ajos laminados.
    - Añade unas gotas de limón al final.
    - Sirve con el arroz blanco.
  validado: false
- id: receta_merluza_patatas
  nombre: Merluza a la plancha con patatas y ensalada
  raciones: 2
  etiquetas: [comida, cena, pescado, alto_en_proteina]
  ingredientes: {merluza: 400, patata_cocida: 400, ensalada_verde: 150, aceite_oliva: 20, ajo: 5, limon: 20}
  pasos:
    - Haz la merluza a la plancha con un poco de aceite.
    - Acompaña con patata cocida y la ensalada aliñada con el resto del aceite y el limón.
  validado: false
- id: receta_macarrones_atun
  nombre: Macarrones con atún y tomate
  raciones: 2
  etiquetas: [comida, pasta, alto_en_proteina]
  ingredientes: {pasta_cocida: 400, atun_natural: 160, salsa_tomate: 200, cebolla: 60, parmesano: 20, aceite_oliva: 10}
  pasos:
    - Pocha la cebolla en el aceite y añade la salsa de tomate y el atún escurrido.
    - Mezcla con la pasta cocida y espolvorea el queso.
  validado: false
- id: receta_pisto_huevo
  nombre: Pisto con huevo y pan integral
  raciones: 2
  etiquetas: [cena, verduras, alto_en_proteina]
  ingredientes: {calabacin: 200, pimiento_rojo: 100, pimiento_verde: 100, cebolla: 100, tomate: 300, huevo: 240, pan_integral: 80, aceite_oliva: 20}
  pasos:
    - Pocha las verduras picadas en el aceite y añade el tomate hasta que espese.
    - Cuaja los huevos encima del pisto.
    - Acompaña con el pan.
  validado: false
- id: receta_revuelto_champinones_gambas
  nombre: Revuelto de champiñones y gambas
  raciones: 2
