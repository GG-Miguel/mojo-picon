# lint and tests on every push and merge request; the evaluation gate on develop and main; build and
# deploy to Cloud Run from main only, after the gate.
# Validate changes to this file in GitLab's Build → Pipeline editor before pushing (CONTRIBUTING).
# secret-detection: in case the Secret Detection template uses its own stage (empty stages are ignored)
stages: [lint, test, secret-detection, eval, deploy, release]

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]

lint:
  stage: lint
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run ruff format --check .

frontend:
  stage: lint
  image: node:22-slim
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx oxlint src
    - npx prettier --check "src/**/*.{ts,tsx,css}"
    - npm run build

test:
  stage: test
  script:
    - uv sync --frozen
    - uv run pytest -m "not integration" --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# Evaluation gate (Plan de evaluación): the sets that are cheap and decide safety, on real Gemini and
# Qdrant. Numbers (no model), RAG (embeddings) and the development partition of safety and attacks
# (~40 Gemini calls, cents); no judge. A failure stops the deploy (the next stage).
eval-gate:
  stage: eval
  rules:
    - if: ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop") && $GCP_WIF_PROVIDER && $GCP_EVAL_SA
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    GOOGLE_APPLICATION_CREDENTIALS: $CI_PROJECT_DIR/.ci_gcp_creds.json
    QDRANT_URL: https://84d5ceea-c6e9-48b7-a73c-c5a8e9379ac8.europe-west3-0.gcp.cloud.qdrant.io
    DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  script:
    - uv sync --frozen --group eval
    - echo "$GITLAB_OIDC_TOKEN" > .ci_oidc_token
    - uv run python -m evals.ci_credentials adc
    - export QDRANT_API_KEY="$(uv run python -m evals.ci_credentials qdrant)"
    - uv run python -m evals.run --sets numbers,rag,safety,attacks --partition desarrollo --no-judge --gate
  artifacts:
    when: always
    paths: [evals/results/]
    expire_in: 30 days

deploy:
  stage: deploy
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $GCP_WIF_PROVIDER && $VITE_FIREBASE_API_KEY
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    IMAGE: $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/mojo-picon/app:$CI_COMMIT_SHORT_SHA
  script:
    # Workload Identity Federation: GitLab's OIDC token -> short-lived GCP credentials (no keys)
    - echo "$GITLAB_OIDC_TOKEN" > .ci_oidc_token
    - gcloud iam workload-identity-pools create-cred-config "$GCP_WIF_PROVIDER"
      --service-account "$GCP_DEPLOY_SA" --credential-source-file .ci_oidc_token --output-file .ci_gcp_creds.json
    - gcloud auth login --cred-file .ci_gcp_creds.json --quiet
    - gcloud config set project "$GCP_PROJECT_ID"
    - gcloud builds submit --config deploy/cloudbuild.yaml
      --substitutions "_IMAGE=$IMAGE,_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY,_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN,_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID"
      --region "$GCP_REGION" --service-account "projects/$GCP_PROJECT_ID/serviceAccounts/$GCP_DEPLOY_SA"
      --gcs-source-staging-dir "gs://$GCP_BUILD_BUCKET/source"
    - sed "s|\${IMAGE}|$IMAGE|" deploy/service.yaml > .ci_service.yaml
    # Public access was granted once by scripts/bootstrap_gcp.sh; replace keeps it
    - gcloud run services replace .ci_service.yaml --region "$GCP_REGION"
    - gcloud run services describe mojo-picon --region "$GCP_REGION" --format 'value(status.url)'
  environment:
    name: production

# A release tag (v0.1.0…) also tags its image, so the repository's cleanup policy keeps it and
# any delivered version can be deployed again exactly (Directrices: Versiones y entregas).
release-image:
  stage: release
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/ && $GCP_WIF_PROVIDER
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    IMAGE_REPO: $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/mojo-picon/app
  script:
    - echo "$GITLAB_OIDC_TOKEN" > .ci_oidc_token
    - gcloud iam workload-identity-pools create-cred-config "$GCP_WIF_PROVIDER"
      --service-account "$GCP_DEPLOY_SA" --credential-source-file .ci_oidc_token --output-file .ci_gcp_creds.json
    - gcloud auth login --cred-file .ci_gcp_creds.json --quiet
    - gcloud artifacts docker tags add "$IMAGE_REPO:$CI_COMMIT_SHORT_SHA" "$IMAGE_REPO:$CI_COMMIT_TAG"
